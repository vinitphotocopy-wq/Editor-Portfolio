<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parv Ai — Video Editor Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ROOT
========================================================= */

:root {
  --bg: #08080b;
  --surface: #111115;
  --surface-2: #15151a;
  --text: #f7f7f8;
  --muted: #92929d;
  --muted-light: #c9c9d0;

  --purple: #8b5cf6;
  --purple-dark: #6d3fd1;
  --purple-light: #b99cff;

  --border: rgba(255,255,255,.08);
  --border-hover: rgba(139,92,246,.35);

  --radius: 20px;
  --container: 1160px;
}

/* =========================================================
   RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}

body {
  min-height: 100vh;
  font-family: "DM Sans", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* Safe background grid */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;

  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);

  background-size: 60px 60px;
}

/* Make actual website content sit above background */
body > * {
  position: relative;
  z-index: 1;
}

h1,
h2,
h3,
.brand {
  font-family: "Manrope", sans-serif;
}

img,
video {
  max-width: 100%;
}

a {
  color: inherit;
}

button {
  font-family: inherit;
}

:focus-visible {
  outline: 2px solid var(--purple-light);
  outline-offset: 3px;
}

::selection {
  background: rgba(139,92,246,.35);
  color: #fff;
}

/* =========================================================
   NAVIGATION
========================================================= */

nav {
  position: sticky;
  top: 12px;
  z-index: 100;

  width: min(calc(100% - 28px), 1160px);
  margin: 12px auto 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 11px 12px 11px 18px;

  background: rgba(12,12,16,.82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border: 1px solid var(--border);
  border-radius: 17px;

  box-shadow: 0 15px 45px rgba(0,0,0,.25);
}

.brand {
  display: flex;
  align-items: center;
  gap: 7px;

  text-decoration: none;

  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -.02em;
}

.brand-mark {
  width: 28px;
  height: 28px;

  display: grid;
  place-items: center;

  border-radius: 9px;

  background: linear-gradient(
    135deg,
    var(--purple),
    var(--purple-dark)
  );

  font-size: .72rem;
}

.brand span:last-child {
  color: var(--purple-light);
}

nav ul {
  display: flex;
  align-items: center;
  gap: 3px;

  list-style: none;
}

nav ul a {
  display: block;

  padding: 8px 12px;

  color: var(--muted);

  text-decoration: none;

  border-radius: 9px;

  font-size: .82rem;
  font-weight: 500;

  transition: .2s ease;
}

nav ul a:hover {
  color: #fff;
  background: rgba(255,255,255,.045);
}

.nav-cta {
  margin-left: 6px;

  color: #fff !important;

  background: linear-gradient(
    135deg,
    var(--purple),
    var(--purple-dark)
  );

  box-shadow: 0 7px 20px rgba(139,92,246,.25);
}

.nav-cta:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 25px rgba(139,92,246,.35);
}

/* =========================================================
   HERO
========================================================= */

header {
  position: relative;

  min-height: 700px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 100px 20px 90px;

  text-align: center;

  overflow: hidden;
}

header::before {
  content: "";

  position: absolute;

  width: 650px;
  height: 650px;

  left: 50%;
  top: -260px;

  transform: translateX(-50%);

  border-radius: 50%;

  background: radial-gradient(
    circle,
    rgba(139,92,246,.20),
    rgba(139,92,246,.06) 40%,
    transparent 70%
  );

  pointer-events: none;
}

.hero-in {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 760px;

  animation: heroEnter .8s ease both;
}

@keyframes heroEnter {
  from {
    opacity: 0;
    transform: translateY(18px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================================================
   PROFILE IMAGE
========================================================= */

.ring {
  position: relative;

  width: 132px;
  height: 132px;

  margin: 0 auto 28px;

  padding: 3px;

  border-radius: 50%;

  background: conic-gradient(
    from 200deg,
    var(--purple),
    #ded3ff,
    var(--purple),
    #5b35a8,
    var(--purple)
  );

  box-shadow:
    0 0 0 7px rgba(139,92,246,.035),
    0 0 55px rgba(139,92,246,.28);
}

.ring::before {
  content: "";

  position: absolute;

  inset: -8px;

  border: 1px solid rgba(139,92,246,.12);

  border-radius: 50%;
}

.profile-pic {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius: 50%;
  border: 4px solid var(--bg);
}

/* =========================================================
   HERO TYPOGRAPHY
========================================================= */

header h1 {
  font-size: clamp(3.3rem, 10vw, 6.2rem);

  line-height: .95;

  font-weight: 800;

  letter-spacing: -.055em;

  background: linear-gradient(
    180deg,
    #ffffff 10%,
    #ffffff 45%,
    #a5a5b0 100%
  );

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;
}

.role {
  margin-top: 17px;

  color: var(--purple-light);

  font-size: .94rem;
  font-weight: 600;
}

.tag {
  max-width: 520px;

  margin: 13px auto 0;

  color: var(--muted);

  font-size: .96rem;
}

/* =========================================================
   BUTTONS
========================================================= */

.hero-btns {
  display: flex;
  justify-content: center;
  align-items: center;

  gap: 10px;

  margin-top: 29px;

  flex-wrap: wrap;
}

.btn {
  min-height: 46px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 0 21px;

  border: 1px solid var(--border);
  border-radius: 13px;

  background: rgba(255,255,255,.035);

  color: #ededf0;

  text-decoration: none;

  font-size: .85rem;
  font-weight: 600;

  transition:
    transform .25s ease,
    background .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.btn:hover {
  transform: translateY(-3px);

  background: rgba(255,255,255,.065);

  border-color: rgba(255,255,255,.14);
}

.btn.pri {
  color: #fff;

  border-color: rgba(255,255,255,.08);

  background: linear-gradient(
    135deg,
    var(--purple),
    var(--purple-dark)
  );

  box-shadow: 0 11px 30px rgba(139,92,246,.27);
}

.btn.pri:hover {
  box-shadow: 0 15px 35px rgba(139,92,246,.38);
}

/* =========================================================
   SECTIONS
========================================================= */

.section {
  width: min(calc(100% - 36px), var(--container));

  margin: 0 auto;

  padding: 72px 0;
}

.head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 27px;
}

.head h2 {
  font-size: clamp(2rem, 5vw, 3rem);

  line-height: 1;

  font-weight: 800;

  letter-spacing: -.045em;
}

.head p {
  margin-top: 8px;

  color: var(--muted);

  font-size: .88rem;
}

.section-number {
  color: #55555f;

  font-family: "Manrope", sans-serif;

  font-size: .7rem;
  font-weight: 700;

  letter-spacing: .12em;
}

/* =========================================================
   ABOUT
========================================================= */

.about {
  position: relative;

  overflow: hidden;

  padding: 38px 40px;

  border: 1px solid var(--border);
  border-radius: 24px;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,.045),
    rgba(255,255,255,.015)
  );

  box-shadow:
    0 25px 70px rgba(0,0,0,.15),
    inset 0 1px 0 rgba(255,255,255,.025);
}

.about::before {
  content: "";

  position: absolute;

  width: 300px;
  height: 300px;

  right: -140px;
  top: -150px;

  border-radius: 50%;

  background: rgba(139,92,246,.08);

  filter: blur(55px);

  pointer-events: none;
}

.about-content {
  position: relative;
  z-index: 2;

  max-width: 850px;
}

.about p {
  color: #d5d5db;

  font-size: .98rem;

  line-height: 1.85;
}

.about p + p {
  margin-top: 15px;

  color: var(--muted);

  font-size: .91rem;
}

.pills {
  display: flex;
  flex-wrap: wrap;

  gap: 9px;

  margin-top: 24px;
}

.pills span {
  padding: 7px 13px;

  border: 1px solid rgba(139,92,246,.22);

  border-radius: 999px;

  background: rgba(139,92,246,.055);

  color: #b7a8d3;

  font-size: .74rem;
}

/* =========================================================
   PORTFOLIO
========================================================= */

.filters {
  display: flex;
  align-items: center;

  width: max-content;
  max-width: 100%;

  gap: 3px;

  margin-bottom: 25px;

  padding: 4px;

  background: rgba(255,255,255,.025);

  border: 1px solid var(--border);
  border-radius: 13px;

  overflow-x: auto;

  scrollbar-width: none;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filter-btn {
  border: 0;

  padding: 9px 16px;

  border-radius: 9px;

  background: transparent;

  color: var(--muted);

  cursor: pointer;

  font-size: .76rem;
  font-weight: 600;

  white-space: nowrap;

  transition: .2s ease;
}

.filter-btn:hover {
  color: #fff;
}

.filter-btn.active {
  color: #fff;

  background: linear-gradient(
    135deg,
    var(--purple),
    var(--purple-dark)
  );

  box-shadow: 0 5px 17px rgba(139,92,246,.25);
}

/* =========================================================
   VIDEO GRID
========================================================= */

.grid {
  display: grid;

  grid-template-columns: repeat(3, minmax(0, 1fr));

  gap: 18px;
}

.card {
  overflow: hidden;

  border: 1px solid var(--border);

  border-radius: 20px;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,.045),
    rgba(255,255,255,.015)
  );

  transition:
    transform .28s ease,
    border-color .28s ease,
    box-shadow .28s ease;
}

.card:hover {
  transform: translateY(-6px);

  border-color: var(--border-hover);

  box-shadow: 0 25px 55px rgba(0,0,0,.40);
}

.card video {
  display: block;

  width: 100%;

  aspect-ratio: 9 / 16;

  object-fit: cover;

  background: #000;
}

.card[data-category="long"] {
  grid-column: 1 / -1;
}

.card[data-category="long"] video {
  aspect-ratio: 16 / 9;
}

.card-info {
  min-height: 63px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  padding: 14px 16px;

  border-top: 1px solid var(--border);
}

.card-info h3 {
  font-size: .87rem;
  font-weight: 700;
}

.badge {
  flex-shrink: 0;

  padding: 4px 9px;

  border: 1px solid rgba(139,92,246,.22);

  border-radius: 999px;

  background: rgba(139,92,246,.055);

  color: #ae9dd0;

  font-size: .64rem;
  font-weight: 600;
}

.hidden {
  display: none !important;
}

/* =========================================================
   SERVICES
========================================================= */

.services {
  display: grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  gap: 14px;
}

.service-tag {
  min-height: 185px;

  padding: 24px;

  border: 1px solid var(--border);

  border-radius: 18px;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,.045),
    rgba(255,255,255,.015)
  );

  transition:
    transform .25s ease,
    border-color .25s ease,
    background .25s ease;
}

.service-tag:hover {
  transform: translateY(-5px);

  border-color: rgba(139,92,246,.28);

  background: linear-gradient(
    145deg,
    rgba(139,92,246,.07),
    rgba(255,255,255,.02)
  );
}

.service-icon {
  width: 37px;
  height: 37px;

  display: grid;
  place-items: center;

  margin-bottom: 29px;

  border: 1px solid rgba(139,92,246,.22);

  border-radius: 10px;

  background: rgba(139,92,246,.07);

  color: var(--purple-light);

  font-family: "Manrope", sans-serif;

  font-size: .68rem;
  font-weight: 800;
}

.service-tag b {
  display: block;

  margin-bottom: 7px;

  font-family: "Manrope", sans-serif;

  font-size: .94rem;
}

.service-tag span {
  color: var(--muted);

  font-size: .78rem;

  line-height: 1.65;
}

/* =========================================================
   TESTIMONIALS
========================================================= */

.testimonials {
  display: grid;

  grid-template-columns: repeat(3, minmax(0, 1fr));

  gap: 16px;
}

.testimonial {
  position: relative;

  min-height: 215px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  gap: 22px;

  padding: 27px;

  overflow: hidden;

  border: 1px solid var(--border);

  border-radius: 20px;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,.045),
    rgba(255,255,255,.015)
  );

  transition:
    transform .25s ease,
    border-color .25s ease;
}

.testimonial:hover {
  transform: translateY(-5px);

  border-color: rgba(139,92,246,.25);
}

.testimonial::before {
  content: "“";

  position: absolute;

  right: 18px;
  top: 8px;

  font-family: Georgia, serif;

  font-size: 5rem;

  line-height: 1;

  color: rgba(139,92,246,.12);
}

.testimonial-text {
  position: relative;
  z-index: 2;

  color: #cfcfd6;

  font-size: .86rem;

  line-height: 1.75;
}

.testimonial-name {
  color: var(--purple-light);

  font-size: .77rem;
  font-weight: 700;
}

/* =========================================================
   CONTACT
========================================================= */

.cta {
  position: relative;

  overflow: hidden;

  padding: 76px 24px;

  text-align: center;

  border: 1px solid var(--border);

  border-radius: 28px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(139,92,246,.17),
      transparent 48%
    ),
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.015)
    );

  box-shadow: 0 30px 80px rgba(0,0,0,.20);
}

.cta::before {
  content: "";

  position: absolute;

  left: 50%;
  top: 0;

  width: 380px;
  height: 1px;

  transform: translateX(-50%);

  background: linear-gradient(
    90deg,
    transparent,
    rgba(139,92,246,.7),
    transparent
  );
}

.cta h2 {
  position: relative;
  z-index: 2;

  font-size: clamp(2rem, 5vw, 3.2rem);

  line-height: 1;

  letter-spacing: -.045em;
}

.cta p {
  position: relative;
  z-index: 2;

  max-width: 460px;

  margin: 14px auto 27px;

  color: var(--muted);

  font-size: .88rem;
}

/* =========================================================
   FOOTER
========================================================= */

footer {
  width: min(calc(100% - 36px), var(--container));

  margin: 0 auto;

  padding: 30px 0 45px;

  border-top: 1px solid var(--border);

  text-align: center;

  color: #64646e;

  font-size: .75rem;
}

footer p + p {
  margin-top: 8px;
}

footer a {
  margin: 0 8px;

  color: #8d8d98;

  text-decoration: none;

  transition: .2s ease;
}

footer a:hover {
  color: var(--purple-light);
}

/* =========================================================
   TABLET
========================================================= */

@media (max-width: 950px) {

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .services {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .testimonials {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .testimonial:last-child {
    grid-column: 1 / -1;
  }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  nav {
    top: 8px;

    width: calc(100% - 16px);

    margin-top: 8px;

    padding: 10px 10px 10px 14px;

    border-radius: 15px;
  }

  .brand-mark {
    width: 26px;
    height: 26px;
  }

  nav ul li:not(:last-child) {
    display: none;
  }

  .nav-cta {
    margin-left: 0;
  }

  header {
    min-height: 650px;

    padding:
      90px 18px
      100px;
  }

  header::before {
    width: 480px;
    height: 480px;

    top: -160px;
  }

  .ring {
    width: 112px;
    height: 112px;

    margin-bottom: 25px;
  }

  header h1 {
    font-size: clamp(3rem, 16vw, 4.2rem);
  }

  .role {
    font-size: .83rem;
  }

  .tag {
    max-width: 340px;

    font-size: .86rem;

    line-height: 1.7;
  }

  .section {
    width: calc(100% - 28px);

    padding: 54px 0;
  }

  .head {
    align-items: flex-start;

    margin-bottom: 22px;
  }

  .head h2 {
    font-size: 2rem;
  }

  .section-number {
    display: none;
  }

  .about {
    padding: 27px 22px;

    border-radius: 20px;
  }

  .about p {
    font-size: .87rem;

    line-height: 1.8;
  }

  .about p + p {
    font-size: .82rem;
  }

  .pills {
    gap: 7px;
  }

  .pills span {
    padding: 7px 10px;

    font-size: .67rem;
  }

  .filters {
    width: 100%;
  }

  .filter-btn {
    flex: 1;
  }

  .grid {
    grid-template-columns: 1fr;

    gap: 14px;
  }

  .card[data-category="long"] {
    grid-column: auto;
  }

  .card[data-category="long"] video {
    aspect-ratio: 16 / 9;
  }

  .services {
    grid-template-columns: 1fr;

    gap: 12px;
  }

  .service-tag {
    min-height: auto;

    padding: 22px;
  }

  .service-icon {
    margin-bottom: 21px;
  }

  .testimonials {
    grid-template-columns: 1fr;

    gap: 12px;
  }

  .testimonial:last-child {
    grid-column: auto;
  }

  .testimonial {
    min-height: 190px;

    padding: 23px;
  }

  .cta {
    padding: 58px 20px;

    border-radius: 23px;
  }

  .cta h2 {
    font-size: 2rem;
  }

  .cta p {
    font-size: .82rem;
  }

  .hero-btns {
    margin-top: 24px;
  }

  .btn {
    min-height: 44px;

    padding: 0 18px;

    font-size: .78rem;
  }

  footer {
    width: calc(100% - 28px);
  }
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 380px) {

  header {
    padding-left: 14px;
    padding-right: 14px;
  }

  .section {
    width: calc(100% - 22px);
  }

  .hero-btns {
    flex-direction: column;

    width: 100%;
  }

  .hero-btns .btn {
    width: 100%;
  }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     NAVIGATION
======================================================= -->

<nav>

  <a class="brand" href="#top" aria-label="Parv Ai home">

    <span class="brand-mark">P</span>

    <span>
      Parv <span>Ai</span>
    </span>

  </a>

  <ul>

    <li>
      <a href="#about">About</a>
    </li>

    <li>
      <a href="#work">Work</a>
    </li>

    <li>
      <a href="#services">Services</a>
    </li>

    <li>
      <a href="#reviews">Reviews</a>
    </li>

    <li>
      <a class="nav-cta" href="#contact">Contact</a>
    </li>

  </ul>

</nav>


<!-- =======================================================
     HERO
======================================================= -->

<header id="top">

  <div class="hero-in">

    <div class="ring">

      <img
        class="profile-pic"
        src="New Project 195 [DD59DE9].png"
        alt="Parv Ai"
        width="13
