<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parv Ai — Video Editor Portfolio</title>

<meta name="description" content="Parv Ai — Video Editor | Content Creator">
<meta name="theme-color" content="#08080b">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#07070a;
  --bg-soft:#0b0b0f;
  --surface:#111116;
  --surface-2:#15151b;
  --surface-3:#19191f;

  --text:#f7f7f9;
  --text-soft:#d1d1d8;
  --muted:#858590;

  --accent:#8b5cf6;
  --accent-light:#b99cff;
  --accent-dark:#6d3ed5;

  --line:rgba(255,255,255,.075);
  --line-hover:rgba(255,255,255,.14);

  --radius-sm:12px;
  --radius-md:18px;
  --radius-lg:26px;

  --container:1180px;
}

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:90px;
}

body{
  font-family:"DM Sans",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-3;

  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);

  background-size:60px 60px;

  mask-image:linear-gradient(
    to bottom,
    black 0%,
    rgba(0,0,0,.7) 40%,
    transparent 100%
  );
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(139,92,246,.13),
      transparent 35%
    );
}

img,
video{
  max-width:100%;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

a{
  color:inherit;
}

button{
  font-family:inherit;
}

:focus-visible{
  outline:2px solid var(--accent-light);
  outline-offset:4px;
}

::selection{
  background:rgba(139,92,246,.35);
  color:#fff;
}

/* =========================================================
   TYPOGRAPHY
========================================================= */

h1,
h2,
h3,
.brand{
  font-family:"Manrope",sans-serif;
}

h1,
h2,
h3{
  color:var(--text);
}

h1,
h2{
  letter-spacing:-.04em;
}

/* =========================================================
   NAVIGATION
========================================================= */

nav{
  position:sticky;
  top:14px;
  z-index:100;

  width:min(calc(100% - 28px),1160px);
  margin:14px auto 0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:12px 14px 12px 18px;

  background:rgba(12,12,16,.76);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border:1px solid var(--line);
  border-radius:18px;

  box-shadow:
    0 18px 50px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.035);

  transition:.3s ease;
}

nav:hover{
  border-color:var(--line-hover);
}

.brand{
  display:flex;
  align-items:center;
  gap:7px;

  font-size:1rem;
  font-weight:800;
  text-decoration:none;
  letter-spacing:-.02em;
}

.brand-mark{
  width:28px;
  height:28px;

  display:grid;
  place-items:center;

  border-radius:9px;

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.95),
      rgba(109,62,213,.8)
    );

  box-shadow:
    0 7px 20px rgba(139,92,246,.25);

  font-size:.72rem;
  font-weight:800;
}

.brand span{
  color:var(--accent-light);
}

nav ul{
  list-style:none;

  display:flex;
  align-items:center;
  gap:4px;
}

nav ul a{
  position:relative;

  display:flex;
  align-items:center;

  padding:8px 12px;

  color:var(--muted);
  text-decoration:none;

  font-size:.82rem;
  font-weight:500;

  border-radius:10px;

  transition:.2s ease;
}

nav ul a:not(.nav-cta):hover{
  color:#fff;
  background:rgba(255,255,255,.045);
}

.nav-cta{
  margin-left:6px;

  color:#fff !important;

  padding:9px 17px !important;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent-dark)
    );

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
    0 8px 22px rgba(139,92,246,.24);
}

.nav-cta:hover{
  transform:translateY(-1px);
  box-shadow:
    0 11px 28px rgba(139,92,246,.34);
}

/* =========================================================
   HERO
========================================================= */

header{
  position:relative;

  min-height:720px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:100px 22px 110px;

  overflow:hidden;
}

.hero-orb{
  position:absolute;
  width:650px;
  height:650px;

  left:50%;
  top:-230px;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(139,92,246,.19),
      rgba(139,92,246,.07) 35%,
      transparent 70%
    );

  filter:blur(3px);

  pointer-events:none;
}

.hero-orb::after{
  content:"";

  position:absolute;
  inset:120px;

  border-radius:50%;

  border:1px solid rgba(139,92,246,.12);
}

.hero-in{
  position:relative;
  z-index:2;

  max-width:780px;

  animation:heroIn .9s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes heroIn{
  from{
    opacity:0;
    transform:translateY(24px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* PROFILE */

.ring{
  position:relative;

  width:132px;
  height:132px;

  margin:0 auto 28px;

  padding:3px;

  border-radius:50%;

  background:
    conic-gradient(
      from 210deg,
      var(--accent),
      #ded3ff,
      var(--accent),
      #4b2a9d,
      var(--accent)
    );

  box-shadow:
    0 0 0 7px rgba(139,92,246,.035),
    0 0 60px rgba(139,92,246,.25);
}

.ring::before{
  content:"";

  position:absolute;
  inset:-8px;

  border-radius:50%;

  border:1px solid rgba(139,92,246,.12);
}

.profile-pic{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  border-radius:50%;

  border:4px solid var(--bg);
}

/* HERO TEXT */

.hero-eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;

  margin-bottom:18px;

  padding:7px 12px;

  border:1px solid rgba(139,92,246,.2);
  border-radius:999px;

  background:rgba(139,92,246,.055);

  color:#bdb0dc;

  font-size:.74rem;
  font-weight:600;

  letter-spacing:.04em;
  text-transform:uppercase;
}

.hero-eyebrow-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--accent-light);

  box-shadow:0 0 12px rgba(185,156,255,.8);
}

header h1{
  font-size:clamp(3.3rem,9vw,6.3rem);

  line-height:.96;

  font-weight:800;

  background:
    linear-gradient(
      180deg,
      #fff 5%,
      #fff 45%,
      #a6a6b1 100%
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  text-shadow:
    0 20px 60px rgba(255,255,255,.04);
}

.role{
  margin-top:18px;

  color:var(--accent-light);

  font-size:.94rem;
  font-weight:600;

  letter-spacing:.02em;
}

.tag{
  max-width:540px;

  margin:14px auto 0;

  color:var(--muted);

  font-size:1rem;
}

/* HERO BUTTONS */

.hero-btns{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  margin-top:30px;

  flex-wrap:wrap;
}

.btn{
  position:relative;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  min-height:46px;

  padding:0 22px;

  border:1px solid var(--line);
  border-radius:13px;

  background:rgba(255,255,255,.035);

  color:#ededf0;

  font-size:.86rem;
  font-weight:600;

  text-decoration:none;

  transition:
    transform .25s ease,
    background .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.btn:hover{
  transform:translateY(-3px);

  background:rgba(255,255,255,.065);

  border-color:var(--line-hover);
}

.btn.pri{
  color:#fff;

  border-color:rgba(255,255,255,.08);

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent-dark)
    );

  box-shadow:
    0 12px 30px rgba(139,92,246,.26);
}

.btn.pri:hover{
  box-shadow:
    0 16px 36px rgba(139,92,246,.36);
}

/* =========================================================
   HERO BOTTOM LINE
========================================================= */

.hero-bottom{
  position:absolute;

  bottom:28px;
  left:50%;

  transform:translateX(-50%);

  display:flex;
  align-items:center;
  gap:12px;

  color:#666672;

  font-size:.7rem;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.hero-bottom-line{
  width:34px;
  height:1px;

  background:rgba(255,255,255,.12);
}

/* =========================================================
   SECTIONS
========================================================= */

.section{
  width:min(calc(100% - 36px),var(--container));

  margin:0 auto;

  padding:72px 0;
}

.head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;

  margin-bottom:28px;
}

.head-left{
  max-width:700px;
}

.head h2{
  font-size:clamp(2rem,5vw,3rem);

  line-height:1;

  font-weight:800;
}

.head p{
  margin-top:9px;

  color:var(--muted);

  font-size:.9rem;
}

.section-number{
  color:#565661;

  font-family:"Manrope",sans-serif;

  font-size:.72rem;
  font-weight:700;

  letter-spacing:.12em;
}

/* =========================================================
   ABOUT
========================================================= */

.about{
  position:relative;

  overflow:hidden;

  padding:40px;

  border:1px solid var(--line);
  border-radius:var(--radius-lg);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.018)
    );

  box-shadow:
    0 25px 70px rgba(0,0,0,.16),
    inset 0 1px 0 rgba(255,255,255,.025);
}

.about::before{
  content:"";

  position:absolute;

  width:300px;
  height:300px;

  right:-130px;
  top:-150px;

  border-radius:50%;

  background:rgba(139,92,246,.08);

  filter:blur(50px);

  pointer-events:none;
}

.about-content{
  position:relative;
  z-index:1;

  max-width:850px;
}

.about p{
  color:#d5d5db;

  font-size:1rem;
  line-height:1.85;
}

.about p+p{
  margin-top:16px;

  color:var(--muted);

  font-size:.94rem;
}

.pills{
  display:flex;
  flex-wrap:wrap;
  gap:9px;

  margin-top:26px;
}

.pills span{
  padding:8px 13px;

  border:1px solid rgba(139,92,246,.2);
  border-radius:999px;

  background:rgba(139,92,246,.055);

  color:#b8a9d5;

  font-size:.76rem;
  font-weight:500;
}

/* =========================================================
   PORTFOLIO
========================================================= */

.portfolio-wrap{
  position:relative;
}

.filters{
  display:flex;
  align-items:center;
  gap:3px;

  width:max-content;
  max-width:100%;

  margin-bottom:26px;

  padding:4px;

  border:1px solid var(--line);
  border-radius:13px;

  background:rgba(255,255,255,.025);

  overflow-x:auto;
}

.filter-btn{
  border:0;

  padding:9px 16px;

  border-radius:9px;

  background:transparent;

  color:var(--muted);

  font:600 .76rem "DM Sans",sans-serif;

  white-space:nowrap;

  cursor:pointer;

  transition:.2s ease;
}

.filter-btn:hover{
  color:#fff;
}

.filter-btn.active{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent-dark)
    );

  box-shadow:
    0 5px 18px rgba(139,92,246,.25);
}

/* VIDEO GRID */

.grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:18px;
}

.card{
  position:relative;

  overflow:hidden;

  border:1px solid var(--line);
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.018)
    );

  transition:
    transform .3s cubic-bezier(.2,.8,.2,1),
    border-color .3s ease,
    box-shadow .3s ease;
}

.card:hover{
  transform:translateY(-7px);

  border-color:rgba(139,92,246,.3);

  box-shadow:
    0 28px 65px rgba(0,0,0,.42);
}

.card-media{
  position:relative;

  background:#000;

  overflow:hidden;
}

.card-media::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      transparent 60%,
      rgba(0,0,0,.25)
    );
}

.card video{
  width:100%;

  aspect-ratio:9/16;

  display:block;

  object-fit:cover;

  background:#000;
}

.card[data-category="long"]{
  grid-column:1/-1;
}

.card[data-category="long"] video{
  aspect-ratio:16/9;
}

.card-info{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  min-height:64px;

  padding:14px 16px;

  border-top:1px solid var(--line);
}

.card-info h3{
  font-size:.88rem;
  font-weight:700;
}

.badge{
  flex-shrink:0;

  padding:4px 9px;

  border:1px solid rgba(139,92,246,.22);
  border-radius:999px;

  background:rgba(139,92,246,.055);

  color:#ad9ccf;

  font-size:.65rem;
  font-weight:600;
}

.hidden{
  display:none !important;
}

/* =========================================================
   SERVICES
========================================================= */

.services{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:14px;
}

.service-tag{
  position:relative;

  min-height:190px;

  padding:24px;

  border:1px solid var(--line);
  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.015)
    );

  transition:
    transform .25s ease,
    border-color .25s ease,
    background .25s ease;
}

.service-tag:hover{
  transform:translateY(-5px);

  border-color:rgba(139,92,246,.28);

  background:
    linear-gradient(
      145deg,
      rgba(139,92,246,.075),
      rgba(255,255,255,.02)
    );
}

.service-icon{
  width:38px;
  height:38px;

  display:grid;
  place-items:center;

  margin-bottom:30px;

  border:1px solid rgba(139,92,246,.22);
  border-radius:11px;

  background:rgba(139,92,246,.07);

  color:var(--accent-light);

  font-family:"Manrope",sans-serif;

  font-size:.72rem;
  font-weight:800;
}

.service-tag b{
  display:block;

  margin-bottom:7px;

  font-family:"Manrope",sans-serif;

  font-size:.96rem;
  font-weight:700;
}

.service-tag span{
  color:var(--muted);

  font-size:.79rem;

  line-height:1.65;
}

/* =========================================================
   TESTIMONIALS
========================================================= */

.testimonials{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:16px;
}

.testimonial{
  position:relative;

  min-height:220px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  gap:24px;

  padding:28px;

  border:1px solid var(--line);
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.015)
    );

  overflow:hidden;

  transition:
    transform .25s ease,
    border-color .25s ease;
}

.testimonial:hover{
  transform:translateY(-5px);

  border-color:rgba(139,92,246,.24);
}

.testimonial::before{
  content:"“";

  position:absolute;

  right:19px;
  top:8px;

  font-family:Georgia,serif;

  font-size:5rem;

  line-height:1;

  color:rgba(139,92,246,.12);
}

.testimonial-text{
  position:relative;
  z-index:1;

  color:#cfcfd6;

  font-size:.87rem;

  line-height:1.75;
}

.testimonial-name{
  color:var(--accent-light);

  font-size:.78rem;
  font-weight:700;
}

/* =========================================================
   CONTACT
========================================================= */

.cta{
  position:relative;

  overflow:hidden;

  text-align:center;

  padding:78px 25px;

  border:1px solid var(--line);
  border-radius:28px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(139,92,246,.17),
      transparent 48%
    ),
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.015)
    );

  box-shadow:
    0 35px 90px rgba(0,0,0,.2);
}

.cta::before{
  content:"";

  position:absolute;

  width:400px;
  height:1px;

  left:50%;
  top:0;

  transform:translateX(-50%);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(139,92,246,.7),
      transparent
    );
}

.cta-content{
  position:relative;
  z-index:1;
}

.cta h2{
  font-size:clamp(2rem,5vw,3.3rem);

  font-weight:800;

  line-height:1;
}

.cta p{
  max-width:460px;

  margin:15px auto 28px;

  color:var(--muted);

  font-size:.9rem;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
  width:min(calc(100% - 36px),var(--container));

  margin:0 auto;

  padding:30px 0 45px;

  border-top:1px solid var(--line);

  text-align:center;

  color:#62626d;

  font-size:.75rem;
}

footer p:last-child{
  margin-top:8px !important;
}

footer a{
  margin:0 8px;

  color:#8d8d99;

  text-decoration:none;

  transition:.2s ease;
}

footer a:hover{
  color:var(--accent-light);
}

/* =========================================================
   REVEAL ANIMATION
========================================================= */

.reveal{
  opacity:0;

  transform:translateY(18px);

  transition:
    opacity .7s ease,
    transform .7s cubic-bezier(.2,.8,.2,1);
}

.reveal.visible{
  opacity:1;
  transform:none;
}

/* =========================================================
   RESPONSIVE — TABLET
========================================================= */

@media(max-width:950px){

  .grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .services{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .testimonials{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .testimonial:last-child{
    grid-column:1/-1;
  }

}

/* =========================================================
   RESPONSIVE — MOBILE
========================================================= */

@media(max-width:700px){

  nav{
    top:8px;
    margin-top:8px;

    width:calc(100% - 16px);

    padding:10px 10px 10px 14px;

    border-radius:15px;
  }

  .brand-mark{
    width:26px;
    height:26px;
  }

  nav ul{
    gap:2px;
  }

  nav ul li:not(:last-child){
    display:none;
  }

  .nav-cta{
    margin-left:0;
  }

  header{
    min-height:680px;

    padding:
      90px 20px
      100px;
  }

  .hero-orb{
    width:480px;
    height:480px;

    top:-150px;
  }

  .ring{
    width:112px;
    height:112px;

    margin-bottom:24px;
  }

  header h1{
    font-size:clamp(3rem,16vw,4.2rem);
  }

  .role{
    font-size:.84rem;
  }

  .tag{
    max-width:340px;

    font-size:.88rem;

    line-height:1.7;
  }

  .hero-bottom{
    bottom:25px;

    font-size:.6rem;
  }

  .section{
    width:calc(100% - 28px);

    padding:54px 0;
  }

  .head{
    align-items:flex-start;

    margin-bottom:22px;
  }

  .section-number{
    display:none;
  }

  .head h2{
    font-size:2rem;
  }

  .about{
    padding:26px 22px;

    border-radius:20px;
  }

  .about p{
